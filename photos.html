    <section class="section">
      <div class="wrap">

          </li>
          <li class="photo-card">
            <figure>

            </figure>
          </li>
          <li class="photo-card">
            <figure>
              <img src="images/family/lila-layla.jpg" alt="Lila and Layla" width="1200" height="1200" loading="lazy" />
              <figcaption>Lila &amp; Layla · 2015</figcaption>
            </figure>
          </li>
          <li class="photo-card photo-card-soon">
            <figure>
              <div class="photo-placeholder">More soon</div>

            </figure>
